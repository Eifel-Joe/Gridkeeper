# Fuehrt die Python-Unit-Tests (pytest) auf GitHub aus, damit Fehler schon im PR
# auffallen. Fusion-Snapshot-Tests (commands/commandSnapshotTests, tests/e2e)
# laufen NUR in Fusion und werden hier nicht ausgefuehrt; pytest prueft nur
# deren Fusion-freie Teile (Fall-Definitionen, Report) ueber die Stubs in tests/stubs.
name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Einzige Abhaengigkeit; adsk wird durch tests/stubs ersetzt (siehe pytest.ini).
      - run: python -m pip install pytest
      - run: python -m pytest
