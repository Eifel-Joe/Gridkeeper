# Runs the pytest unit tests on GitHub, so a pull request shows breakage before it's merged.
# The shape snapshot tests (commands/commandSnapshotTests, tests/e2e) build bodies and run inside
# Fusion only, pytest checks just their Fusion-free parts with the adsk stubs in tests/stubs.
name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is what current Fusion builds ship, 3.13 what older ones and local setups use
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the only dependency, adsk comes from tests/stubs, see pytest.ini
      - run: python -m pip install pytest
      - run: python -m pytest
