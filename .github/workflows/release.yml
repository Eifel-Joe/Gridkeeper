on:
  push:
    tags:
      # only Gridkeeper's own tags; the tags of GridfinityGenerator (v1.0.0.0 ...) must not start a release
      - 'gridkeeper-v*'
name: Handle Release
# the repository's token is read-only by default; creating the release and uploading the ZIP need write access
permissions:
  contents: write
jobs:
  generate-installer:
    name: Create release-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create zip file for manual installation
        # the add-in in a folder named Gridkeeper: Fusion loads it only when the folder is named like the manifest
        shell: bash
        run: |
          mkdir -p Gridkeeper/documentation dist
          cp -r Gridkeeper.manifest Gridkeeper.py api.py config.py LICENSE.md lib commands Gridkeeper/
          cp documentation/PRIVACY_POLICY.md Gridkeeper/documentation/
          # gridkeeper-v1.0.0 -> Gridkeeper-v1.0.0.zip
          zip="dist/Gridkeeper-${GITHUB_REF_NAME#gridkeeper-}.zip"
          7z a "$zip" Gridkeeper
          7z l "$zip"
      - name: Upload the artifacts
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          prerelease: false
