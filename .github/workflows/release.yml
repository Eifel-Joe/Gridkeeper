on:
  push:
    tags:
      - '*'
name: Handle Release
jobs:
  generate-installer:
    name: Create release-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create zip file for manual installation
        # the add-in in a folder named Gridkeeper: Fusion loads it only when the folder is named like the manifest
        shell: bash
        run: |
          mkdir -p Gridkeeper/documentation dist
          cp -r Gridkeeper.manifest Gridkeeper.py config.py LICENSE.md lib commands Gridkeeper/
          cp documentation/PRIVACY_POLICY.md Gridkeeper/documentation/
          7z a "dist/Gridkeeper-${{ github.ref_name }}.zip" Gridkeeper
          7z l "dist/Gridkeeper-${{ github.ref_name }}.zip"
      - name: Upload the artifacts
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          body: TBD
          prerelease: true
